# BishOS boot menu -- one config for every architecture.
#
# The console= chain is the whole trick: the kernel hands /dev/console to the
# LAST console= that actually registers, and silently skips ones whose
# hardware is absent. So a single line covers every target:
#   x86_64            -> ttyS0  (16550 present, no PL011)
#   arm64 QEMU virt   -> ttyAMA0 (PL011 present)
#   arm64 VMware      -> tty0   (neither UART exists)
set default=0
set timeout=3

menuentry "BishOS" {
    linux  /boot/vmlinuz console=tty0 console=ttyS0 console=ttyAMA0 quiet panic=1
    initrd /boot/initramfs.cpio.gz
}

# For real hardware with a phantom serial port, where the chain above would
# put the shell on a UART nobody is watching.
menuentry "BishOS (force display console)" {
    linux  /boot/vmlinuz console=tty0 quiet panic=1
    initrd /boot/initramfs.cpio.gz
}
