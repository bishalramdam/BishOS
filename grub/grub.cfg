# BishOS arm64 UEFI boot menu.
# console= trick: the kernel makes the LAST console that actually exists
# /dev/console. QEMU's virt machine has a PL011 (ttyAMA0) -> serial shell;
# VMware Fusion has no PL011, so ttyAMA0 never registers -> shell lands on
# the framebuffer (tty0). One entry serves both hypervisors.
set default=0
set timeout=3

menuentry "BishOS (arm64)" {
    linux  /boot/Image console=tty0 console=ttyAMA0 quiet panic=1
    initrd /boot/initramfs.cpio.gz
}
