# BishOS boot menu -- one config for every architecture.
#
# The console must be named per-arch, not stacked into one chain. The kernel
# makes the LAST console= the preferred one, and that is what /dev/console --
# and therefore init's shell -- attaches to. Naming a console whose hardware
# is absent (ttyAMA0 on x86) leaves the preferred console unregistered, and
# output falls back to the framebuffer, which is invisible under -nographic.
# grub_cpu tells us which platform we booted on, so we name only real ones.
if [ "$grub_cpu" = "arm64" ]; then
    set consoles="console=tty0 console=ttyAMA0"   # PL011 on QEMU virt
else
    set consoles="console=tty0 console=ttyS0"     # 16550 on PC hardware
fi

set default=0
set timeout=3

menuentry "BishOS" {
    linux  /boot/vmlinuz $consoles quiet panic=1
    initrd /boot/initramfs.cpio.gz
}

# For hardware with a serial port nobody is watching: keep the shell on the
# display. Also the entry to pick if the default boots to a blank screen.
menuentry "BishOS (force display console)" {
    linux  /boot/vmlinuz console=tty0 quiet panic=1
    initrd /boot/initramfs.cpio.gz
}
