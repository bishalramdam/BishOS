# BishOS boot menu -- one config for every architecture.
#
# The kernel makes the LAST console= that actually registers the preferred
# one, and that is what /dev/console -- and so the login shell -- attaches to.
# Naming a console whose hardware is absent is harmless; it is simply skipped.
#
# The display is named last on purpose: on a real machine the screen is the
# only thing anyone is looking at, and a serial port that exists but has
# nothing attached would silently swallow the shell. Headless setups have no
# display device, so tty0 never registers there and the UART wins instead.
if [ "$grub_cpu" = "arm64" ]; then
    set consoles="console=ttyAMA0 console=tty0"   # PL011 on QEMU virt
else
    set consoles="console=ttyS0 console=tty0"     # 16550 on PC hardware
fi

set default=0
set timeout=3

menuentry "BishOS" {
    linux  /boot/vmlinuz $consoles quiet panic=1
    initrd /boot/initramfs.cpio.gz
}

# For a headless machine driven entirely over a serial cable, where the
# display console would otherwise take the shell.
menuentry "BishOS (force serial console)" {
    linux  /boot/vmlinuz console=ttyS0 console=ttyAMA0 quiet panic=1
    initrd /boot/initramfs.cpio.gz
}
