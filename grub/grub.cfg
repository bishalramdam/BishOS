# BishOS boot menu -- one config for every architecture.
#
# The kernel makes the LAST console= that actually registers the preferred
# one, and that is what /dev/console -- and so the login shell -- attaches to.
# Naming a console whose hardware is absent is harmless; it is simply skipped.
#
# The display is named last on purpose: on a real machine the screen is the
# only thing anyone is looking at, and a serial port that exists but has
# nothing attached would silently swallow the shell. Headless setups have no
# display device, so tty0 never registers there and the UART wins instead.
if [ "$grub_cpu" = "arm64" ]; then
    set consoles="console=ttyAMA0 console=tty0"   # PL011 on QEMU virt
else
    set consoles="console=ttyS0 console=tty0"     # 16550 on PC hardware
fi

# Terminus 16x32 rather than the 8x16 default: twice the size in each
# direction, which is the difference between readable and not on a real
# monitor. Ignored by a serial console, which has no font at all.
set fbfont="fbcon=font:TER16x32"

set default=0
set timeout=5

menuentry "BishOS" {
    linux  /boot/vmlinuz $consoles $fbfont quiet panic=1
    initrd /boot/initramfs.cpio.gz
}

# If the screen goes black after this menu, start here.
#
# nomodeset stops the real GPU driver from loading, so the framebuffer the
# firmware set up is left alone and keeps the console. That is the usual cause
# of a blank screen on a machine whose graphics the kernel does drive: the
# driver takes the display over and, if it provides no console of its own,
# nothing replaces what it displaced. Dropping quiet means the boot narrates
# itself, so a failure that is not about graphics at all is visible too.
menuentry "BishOS (safe graphics, verbose)" {
    linux  /boot/vmlinuz console=tty0 $fbfont nomodeset panic=1
    initrd /boot/initramfs.cpio.gz
}

# The screen and nothing else, with the boot narrated. Use when the machine
# has a serial port that is not connected to anything: naming it at all lets
# it register, and a registered console with no terminal on the far end
# silently swallows the shell.
menuentry "BishOS (screen only, verbose)" {
    linux  /boot/vmlinuz console=tty0 $fbfont panic=1
    initrd /boot/initramfs.cpio.gz
}

# For a headless machine driven entirely over a serial cable, where the
# display console would otherwise take the shell. Not this one if you are
# looking at a monitor -- it sends everything down a wire instead.
menuentry "BishOS (force serial console)" {
    linux  /boot/vmlinuz console=ttyS0 console=ttyAMA0 quiet panic=1
    initrd /boot/initramfs.cpio.gz
}
