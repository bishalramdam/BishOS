# Spotlight-ish launcher.
#
# fuzzel reads the .desktop files that packages install into
# /usr/share/applications, so anything installed with apk appears here
# automatically. Type part of a name; it matches anywhere in the word, not
# just the start.

[main]
font=DejaVu Sans:size=14
dpi-aware=no
width=45
lines=8
horizontal-pad=28
vertical-pad=18
inner-pad=10
icon-theme=Adwaita
icons-enabled=yes
prompt=">  "
layer=overlay

[colors]
background=1e1e1ef2
text=e8e8e8ff
match=4a9eeaff
selection=3a6ea5ff
selection-text=ffffffff
selection-match=9fd0ffff
border=00000000

[border]
width=0
radius=14
