# GTK needs telling which themes to use. With nothing set it falls back to
# "hicolor", the bare fallback, which contains almost no application icons --
# so every GTK program reports missing icons even when good themes exist.
#
# There is no settings daemon here (no GNOME, no xsettingsd), so this file is
# the only thing GTK reads. Applications read it once at startup, which is why
# a change appears to do nothing until they are restarted.
#
# Names must match the directory names under ~/.local/share/themes and
# ~/.local/share/icons exactly, capitals included: WhiteSur-Dark is the GTK
# theme, WhiteSur-dark is the icon theme, and the difference in case is real.
# Window buttons on the left, macOS order: close, minimise, maximise.
#
# Everything before the colon is drawn on the left of the titlebar and
# everything after it on the right, so ending with ":" leaves the right side
# empty. This only reaches applications that draw their own titlebar -- loupe
# and other GTK4 programs with a headerbar. Thunar has a menubar instead and
# is decorated by sway, which draws no buttons at all and cannot be made to.
[Settings]
gtk-decoration-layout=close,minimize,maximize:
gtk-theme-name=WhiteSur-Dark
gtk-icon-theme-name=WhiteSur-dark
gtk-font-name=DejaVu Sans 11
gtk-application-prefer-dark-theme=1
gtk-cursor-theme-name=WhiteSur-cursors
gtk-cursor-theme-size=24
