# GTK needs telling which icon theme to use. With nothing set it falls back to
# "hicolor", which is the bare fallback theme and contains almost no
# application icons -- so every GTK program reports missing icons even when
# perfectly good themes are installed.
[Settings]
gtk-theme-name=Adwaita-dark
gtk-icon-theme-name=Papirus-Dark
gtk-font-name=DejaVu Sans 11
gtk-application-prefer-dark-theme=1
gtk-cursor-theme-name=Adwaita
gtk-cursor-theme-size=24
