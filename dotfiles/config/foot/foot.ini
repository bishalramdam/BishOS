# foot -- the terminal.
#
# foot ships with no config at all, and its defaults are small plain text in
# DejaVu Sans Mono. That looks poor, which is easy to mistake for the terminal
# being poor: it is the fastest and smallest of the Wayland terminals.
#
# The font must be the "Nerd Font Mono" family, not "Nerd Font". The plain one
# is proportional and has no icons; the Mono one is fixed width and carries
# them. With the wrong one, anything drawing icons -- yazi, a shell prompt --
# shows empty boxes.

font=JetBrainsMono Nerd Font Mono:size=12
font-bold=JetBrainsMono Nerd Font Mono:weight=bold:size=12
line-height=17
letter-spacing=0
dpi-aware=no
pad=14x12

initial-window-size-chars=110x32

[cursor]
style=beam
beam-thickness=2
blink=yes

[mouse]
hide-when-typing=yes

[scrollback]
lines=10000
multiplier=3

# [colors] was renamed in foot 1.23: there are now separate light and dark
# sets, and the old name warns once per setting on every launch. Both are
# given here so the terminal is right whichever the system asks for.
[colors-dark]
alpha=0.94
background=1c1c1c
foreground=d4d4d4
regular0=3b3b3b
regular1=e06c75
regular2=98c379
regular3=e5c07b
regular4=61afef
regular5=c678dd
regular6=56b6c2
regular7=d4d4d4
bright0=5c6370
bright1=ef7a83
bright2=a8d99f
bright3=f0cd91
bright4=7cc0ff
bright5=d79bea
bright6=6bc9d4
bright7=ffffff

[colors-light]
alpha=0.96
background=fafafa
foreground=2c2c2c
regular0=3b3b3b
regular1=c0392b
regular2=4a8f3c
regular3=9a7d0a
regular4=2b6cb0
regular5=8e44ad
regular6=1d7e84
regular7=2c2c2c
bright0=5c6370
bright1=e06c75
bright2=98c379
bright3=e5c07b
bright4=61afef
bright5=c678dd
bright6=56b6c2
bright7=1a1a1a

[key-bindings]
font-increase=Control+plus Control+equal
font-decrease=Control+minus
font-reset=Control+0
clipboard-copy=Control+Shift+c Super+c
clipboard-paste=Control+Shift+v Super+v
search-start=Control+Shift+f Super+f
