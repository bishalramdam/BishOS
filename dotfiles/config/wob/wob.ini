# A thin overlay bar that appears when the volume changes, then fades.
#
# Chosen over putting a number in the status bar: you see it exactly when it
# is relevant and never otherwise, which is what macOS does.
#
# wob reads numbers 0-100 on stdin and draws a bar. It knows nothing about
# volume -- the keybindings do the measuring and write the value to a pipe.

[]
timeout = 1000
max = 100
anchor = bottom
margin = 100
width = 320
height = 36
border_offset = 0
border_size = 2
bar_padding = 3
background_color = 1e1e1ee0
bar_color = ffffffff
border_color = ffffff33
overflow_bar_color = e06c75ff
