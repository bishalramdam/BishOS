name: Build ISOs

# Bootable ISOs for both architectures. Each arch builds on a native runner
# (ubuntu-latest = x86_64, ubuntu-24.04-arm = arm64), so nothing is emulated
# and the arm64 kernel needs no cross-toolchain.
on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            firmware: UEFI + BIOS (GRUB)
          - arch: arm64
            runner: ubuntu-24.04-arm
            firmware: UEFI (GRUB)

    name: ${{ matrix.arch }} - ${{ matrix.firmware }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # The kernel source tarball is checksum-pinned in the Makefile, so
      # caching it by that pin is always safe -- a bumped version misses
      # the cache and re-downloads.
      - name: Read versions
        id: ver
        run: |
          BISHOS_VERSION=$(make -s print-version)
          echo "bishos=$BISHOS_VERSION" >> "$GITHUB_OUTPUT"
          echo "kernel=$(make -s print-kernel-version)" >> "$GITHUB_OUTPUT"
          echo "iso=bishos-${{ matrix.arch }}_v$BISHOS_VERSION.iso" >> "$GITHUB_OUTPUT"
          # A tag must agree with the Makefile, or the artifact would be
          # named one version and released as another.
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            TAG_VERSION=${GITHUB_REF_NAME#v}
            if [ "$TAG_VERSION" != "$BISHOS_VERSION" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match Makefile VERSION=$BISHOS_VERSION"
              exit 1
            fi
          fi

      - name: Cache kernel tarball
        uses: actions/cache@v4
        with:
          path: kernel-cache
          key: linux-${{ steps.ver.outputs.kernel }}

      # Docker volumes cannot be restored from cache, so seed the volume from
      # the cached tarball (and save it back) to skip the ~140 MB download.
      - name: Seed kernel volume from cache
        run: |
          docker volume create bishos-kernel
          if [ -f kernel-cache/linux-${{ steps.ver.outputs.kernel }}.tar.xz ]; then
            docker run --rm -v bishos-kernel:/kbuild -v "$PWD/kernel-cache":/cache \
              debian:trixie-slim cp /cache/linux-${{ steps.ver.outputs.kernel }}.tar.xz /kbuild/
          fi

      - name: Build ISO
        run: make ARCH=${{ matrix.arch }} iso

      - name: Save kernel tarball to cache
        run: |
          mkdir -p kernel-cache
          docker run --rm -v bishos-kernel:/kbuild -v "$PWD/kernel-cache":/cache \
            debian:trixie-slim cp /kbuild/linux-${{ steps.ver.outputs.kernel }}.tar.xz /cache/

      - name: Verify ISO is bootable
        run: |
          ls -lh build/${{ matrix.arch }}/${{ steps.ver.outputs.iso }}
          docker run --rm -v "$PWD":/src bishos-iso:${{ matrix.arch }} \
            xorriso -indev /src/build/${{ matrix.arch }}/${{ steps.ver.outputs.iso }} \
                    -report_el_torito plain

      # Two-phase boot test.
      #
      # Ordering console= cannot serve both cases: CONFIG_DUMMY_CONSOLE means
      # tty0 registers even with no display hardware, swallowing output on a
      # headless runner, while naming the serial port last steals the shell on
      # a real machine where nothing is attached to it. So the ISO ships a
      # display-first cmdline for humans, and CI proves the pieces separately:
      # the kernel and init are booted directly with an explicit serial
      # console, and the ISO is booted to prove GRUB loads that kernel.
      - name: Boot test
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          ARCH=${{ matrix.arch }}
          ISO=build/$ARCH/${{ steps.ver.outputs.iso }}

          if [ "$ARCH" = "arm64" ]; then
            sudo apt-get install -y -qq qemu-system-arm qemu-efi-aarch64 > /dev/null 2>&1
            cp /usr/share/AAVMF/AAVMF_CODE.fd /tmp/fw.fd
            cp /usr/share/AAVMF/AAVMF_VARS.fd /tmp/vars.fd
            QEMU="qemu-system-aarch64 -machine virt -cpu max"
            KERNEL=build/$ARCH/Image
            CONSOLE=ttyAMA0
          else
            sudo apt-get install -y -qq qemu-system-x86 ovmf > /dev/null 2>&1
            cp /usr/share/OVMF/OVMF_CODE_4M.fd /tmp/fw.fd
            cp /usr/share/OVMF/OVMF_VARS_4M.fd /tmp/vars.fd
            QEMU="qemu-system-x86_64"
            KERNEL=build/$ARCH/bzImage
            CONSOLE=ttyS0
          fi

          if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then ACCEL="-accel kvm"; else ACCEL="-accel tcg"; fi

          # wait_for <logfile> <pattern> -- poll, then kill whatever we started
          wait_for() {
            for _ in $(seq 1 150); do
              grep -aqE "$2" "$1" && break
              kill -0 "$QPID" 2>/dev/null || break
              sleep 2
            done
            kill "$QPID" 2>/dev/null || true
            wait "$QPID" 2>/dev/null || true
          }

          echo "::group::Phase 1 - kernel + init, direct boot over serial"
          $QEMU $ACCEL -m 512 -kernel "$KERNEL" \
            -initrd build/$ARCH/initramfs.cpio.gz \
            -append "console=$CONSOLE quiet panic=1" \
            -nographic -no-reboot > direct.log 2>&1 &
          QPID=$!
          wait_for direct.log "Welcome to BishOS|Kernel panic"
          tr -d "\000" < direct.log | tail -25
          echo "::endgroup::"

          if grep -aq "Kernel panic" direct.log; then
            echo "::error::kernel panicked booting directly"; exit 1
          fi
          if ! grep -aq "Welcome to BishOS" direct.log; then
            echo "::error::kernel + initramfs did not reach the BishOS banner"; exit 1
          fi

          echo "::group::Phase 2 - ISO boots through UEFI and GRUB"
          $QEMU $ACCEL -m 512 \
            -drive if=pflash,format=raw,readonly=on,file=/tmp/fw.fd \
            -drive if=pflash,format=raw,file=/tmp/vars.fd \
            -cdrom "$ISO" -nographic -no-reboot > iso.log 2>&1 &
          QPID=$!
          wait_for iso.log "Booting .BishOS|Welcome to BishOS|Kernel panic"
          tr -d "\000" < iso.log | tail -25
          echo "::endgroup::"

          if grep -aq "Kernel panic" iso.log; then
            echo "::error::kernel panicked booting the ISO"; exit 1
          fi
          # The ISO hands the console to the display for real hardware, so the
          # banner is not expected here -- reaching the handoff is the proof.
          if ! grep -aqE "Booting .BishOS|Welcome to BishOS" iso.log; then
            echo "::error::GRUB did not load the kernel from the ISO"; exit 1
          fi
          echo "Boot test passed: kernel+init verified directly, ISO verified through GRUB."

      # GitHub Packages has no plain-file registry, so the ISO goes up as an
      # OCI artifact -- which is what makes it appear under Packages. Pull it
      # back with:
      #   oras pull ghcr.io/<owner>/bishos:<version>-<arch>
      - name: Publish ISO to GitHub Packages (ghcr.io)
        if: github.event_name != 'pull_request'
        uses: oras-project/setup-oras@v1

      - name: Push OCI artifact
        if: github.event_name != 'pull_request'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr "[:upper:]" "[:lower:]")
          echo "$GHCR_TOKEN" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          cd build/${{ matrix.arch }}
          oras push \
            "ghcr.io/$OWNER/bishos:${{ steps.ver.outputs.bishos }}-${{ matrix.arch }}" \
            --artifact-type application/vnd.bishos.iso.v1 \
            --annotation "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --annotation "org.opencontainers.image.version=${{ steps.ver.outputs.bishos }}" \
            --annotation "org.opencontainers.image.revision=${{ github.sha }}" \
            "${{ steps.ver.outputs.iso }}:application/vnd.efi.iso"

      - uses: actions/upload-artifact@v4
        with:
          name: bishos-${{ steps.ver.outputs.bishos }}-${{ matrix.arch }}-iso
          path: build/${{ matrix.arch }}/${{ steps.ver.outputs.iso }}
          retention-days: 30

  # Tagging v* publishes both ISOs as a GitHub Release.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: isos
      - uses: softprops/action-gh-release@v2
        with:
          files: isos/**/*.iso
          generate_release_notes: true
