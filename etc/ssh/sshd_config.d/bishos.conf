# BishOS sshd policy. A drop-in rather than an edit to /etc/ssh/sshd_config,
# because that file arrives with the openssh package and would lose the change
# on any reinstall or upgrade.

# root may not log in over the network. "root" is the one account name every
# scanner on the internet already knows to try, and BishOS has a better route:
# bishal has a password and sudo, so nothing is lost by closing this.
PermitRootLogin no

# Passwords are how BishOS authenticates -- the first boot sets them, and
# there is no key-distribution story yet. Worth revisiting when there is: keys
# would let this become "no" and take password guessing off the table.
PasswordAuthentication yes
